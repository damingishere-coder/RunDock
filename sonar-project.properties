sonar.projectKey=rundock-alter-v1-audit
sonar.projectName=RunDock
sonar.sourceEncoding=UTF-8
sonar.sources=src,web-ui/src,desktop-shell/src
sonar.tests=web-ui/src
sonar.test.inclusions=web-ui/src/**/*.test.ts,web-ui/src/**/*.test.tsx
sonar.exclusions=web-ui/dist/**,web-ui/coverage/**,target/**
sonar.javascript.lcov.reportPaths=web-ui/coverage/lcov.info
sonar.rust.lcov.reportPaths=coverage/rust-lcov.info
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
