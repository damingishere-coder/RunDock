<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">RunDock</title>
  <desc id="description">A blue connected run symbol on an icy white rounded square.</desc>
  <defs>
    <linearGradient id="surface" x1="72" y1="44" x2="428" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.56" stop-color="#F6FAFF"/>
      <stop offset="1" stop-color="#E5F0FF"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="142" y1="120" x2="390" y2="388" gradientUnits="userSpaceOnUse">
      <stop stop-color="#18A8FF"/>
      <stop offset="0.52" stop-color="#147BFF"/>
      <stop offset="1" stop-color="#1049D8"/>
    </linearGradient>
    <filter id="surfaceShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#195DB8" flood-opacity="0.17"/>
    </filter>
    <filter id="ribbonShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#073B99" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect x="32" y="24" width="448" height="448" rx="112" fill="url(#surface)" stroke="#D9E8FA" stroke-width="6" filter="url(#surfaceShadow)"/>
  <path d="M164 144 L366 256 L164 368 Z" fill="none" stroke="url(#ribbon)" stroke-width="78" stroke-linecap="round" stroke-linejoin="round" filter="url(#ribbonShadow)"/>
  <path d="M166 129 L363 239" fill="none" stroke="#63D7FF" stroke-width="5" stroke-linecap="round" opacity="0.75"/>
  <circle cx="164" cy="144" r="17" fill="#F8FBFF" stroke="#CFE0F5" stroke-width="3"/>
  <circle cx="366" cy="256" r="17" fill="#F8FBFF" stroke="#CFE0F5" stroke-width="3"/>
  <circle cx="164" cy="368" r="17" fill="#F8FBFF" stroke="#CFE0F5" stroke-width="3"/>
</svg>
