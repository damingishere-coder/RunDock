# lefthook.yml — git hook runner for alter-pm2
# Activate hooks: cd web-ui && npx lefthook install
# Docs: https://lefthook.dev/configuration/

pre-commit:
  parallel: true
  jobs:
    # @group Validation : Lint + format staged frontend TS/TSX files
    - name: lint-staged-ui
      root: "web-ui/"
      run: npx lint-staged

    # @group Validation : Check Rust formatting (fails if cargo fmt would change anything)
    - name: fmt-rust
      glob: "**/*.rs"
      run: cargo fmt --all -- --check

    # @group Validation : Minimum compile/type safety before a local commit.
    # Full tests, coverage, audit, packaging and Sonar remain mandatory in CI.
    - name: check-rust
      glob: "{**/*.rs,Cargo.toml,Cargo.lock,rust-toolchain.toml}"
      run: cargo check --all-targets --locked

    - name: typecheck-ui
      root: "web-ui/"
      glob: "src/**/*.{ts,tsx}"
      run: npm run typecheck
