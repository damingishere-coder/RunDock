name: Quality

on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: true
  pull_request:
  push:
    branches:
      - main
      - master
      - "codex/**"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NPM_VERSION: 11.12.1

jobs:
  sonar-configuration:
    name: SonarQube gate configuration
    if: >-
      github.event_name == 'workflow_call' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require SonarQube gate configuration
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_HOST_URL" ] || [ -z "$SONAR_TOKEN" ]; then
            echo "::error::SONAR_HOST_URL and SONAR_TOKEN are required on protected pushes and internal pull requests."
            exit 1
          fi

  frontend:
    name: Frontend quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web-ui
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - name: Install pinned npm
        run: npm install --global "npm@$NPM_VERSION" && test "$(npm --version)" = "$NPM_VERSION"
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm audit --audit-level=high
      - run: npm run test:coverage
      - name: Upload frontend coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-coverage
          path: web-ui/coverage/lcov.info
          if-no-files-found: error
          retention-days: 7
      - run: npm run build

  rust:
    name: Rust quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - name: Build embedded web UI
        working-directory: web-ui
        run: |
          npm install --global "npm@$NPM_VERSION"
          test "$(npm --version)" = "$NPM_VERSION"
          npm ci
          npm run build
      - name: Set up Rust
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy,llvm-tools-preview
          rustup default 1.98.0
      - name: Install pinned Rust coverage tool
        run: cargo install cargo-llvm-cov --version 0.9.0 --locked
      - name: Install pinned Rust security audit tool
        run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo fmt --all -- --check
      - run: cargo check --all-targets --locked
      - run: cargo audit
      - name: Test with Rust LCOV coverage
        run: |
          mkdir -p coverage
          cargo llvm-cov --all-targets --locked --lcov --output-path coverage/rust-lcov.info --fail-under-lines 20
      - name: Upload Rust coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rust-coverage
          path: coverage/rust-lcov.info
          if-no-files-found: error
          retention-days: 7
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Build release binary for package smoke
        run: cargo build --release --locked
      - name: Upload Linux release binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rundock-linux-binary
          path: target/release/alter
          if-no-files-found: error
          retention-days: 7

  packaging-linux:
    name: Linux package smoke
    needs: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Download tested release binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rundock-linux-binary
          path: package-input
      - name: Validate scripts, package the real binary, and inspect payload
        run: |
          bash -n scripts/build-deb.sh packaging/debian/postinst packaging/debian/prerm packaging/debian/postrm
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          cp package-input/alter "$temp_dir/alter"
          chmod 755 "$temp_dir/alter"
          (
            cd "$temp_dir"
            bash "$GITHUB_WORKSPACE/scripts/build-deb.sh" ./alter 0.0.0 amd64
          )
          dpkg-deb --info "$temp_dir/alter_0.0.0_amd64.deb"
          package_contents="$(dpkg-deb --contents "$temp_dir/alter_0.0.0_amd64.deb")"
          grep -F './usr/local/bin/alter' <<< "$package_contents"
          grep -F './lib/systemd/system/alter-daemon.service' <<< "$package_contents"

  packaging-windows:
    name: Windows installer smoke
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - name: Build embedded web UI
        working-directory: web-ui
        shell: pwsh
        run: |
          npm install --global "npm@$env:NPM_VERSION"
          if ((npm --version) -ne $env:NPM_VERSION) { throw "Unexpected npm version" }
          npm ci
          npm run build
      - name: Set up Rust
        shell: pwsh
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
      - name: Build real Windows release binary
        shell: pwsh
        run: |
          cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { throw "alter release build failed" }
          cargo test --manifest-path desktop-shell\Cargo.toml --all-targets --locked
          if ($LASTEXITCODE -ne 0) { throw "desktop shell tests failed" }
          cargo build --manifest-path desktop-shell\Cargo.toml --release --locked
          if ($LASTEXITCODE -ne 0) { throw "desktop shell release build failed" }
          $loader = 'desktop-shell\target\release\WebView2Loader.dll'
          if (-not (Test-Path -LiteralPath $loader)) {
            $loaderSource = Get-ChildItem 'desktop-shell\target\release\build' -Filter WebView2Loader.dll -File -Recurse |
              Where-Object FullName -Match '[\\/]out[\\/]x64[\\/]WebView2Loader\.dll$' |
              Sort-Object LastWriteTimeUtc -Descending |
              Select-Object -First 1
            if (-not $loaderSource) { throw 'WebView2Loader.dll was not produced by the desktop build' }
            Copy-Item -LiteralPath $loaderSource.FullName -Destination $loader
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $loader
          if ($signature.Status -ne 'Valid' -or
              $signature.SignerCertificate.Subject -notmatch '(^|,\s*)O=Microsoft Corporation(,|$)') {
            throw 'WebView2Loader.dll does not have the expected Microsoft signature'
          }
      - name: Stage verified WebView2 bootstrapper
        shell: pwsh
        run: .\scripts\stage-webview2.ps1
      - name: Install pinned Inno Setup
        run: choco install innosetup --version=6.7.1 --no-progress -y
      - name: Compile installer with the real release binary
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq 'alter').version
          if (-not $version) { throw "Unable to derive Alter version from Cargo metadata" }
          $issPath = 'installer\alter-setup.iss'
          $iss = Get-Content -LiteralPath $issPath -Raw
          $pattern = '#define AppVersion\s+"[^"]+"'
          if ([regex]::Matches($iss, $pattern).Count -ne 1) {
            throw "Expected exactly one AppVersion definition"
          }
          Set-Content -LiteralPath $issPath -Value ([regex]::Replace($iss, $pattern, "#define AppVersion   `"$version`"")) -NoNewline
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\alter-setup.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup validation failed" }
          Get-Item -LiteralPath "dist\RunDock-$version-windows-x64-setup.exe" -ErrorAction Stop | Out-Null
      - name: Install and smoke the packaged desktop app
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq 'alter').version
          $installer = (Resolve-Path "dist\RunDock-$version-windows-x64-setup.exe").Path
          $installDir = Join-Path $env:RUNNER_TEMP 'RunDockInstallSmoke'
          $install = Start-Process -FilePath $installer -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$installDir"
          ) -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "silent install failed: $($install.ExitCode)" }

          $shell = Join-Path $installDir 'rundock.exe'
          $daemon = Join-Path $installDir 'alter.exe'
          $loader = Join-Path $installDir 'WebView2Loader.dll'
          Get-Item -LiteralPath $shell, $daemon, $loader -ErrorAction Stop | Out-Null
          $shortcut = Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs\RunDock\RunDock.lnk'
          Get-Item -LiteralPath $shortcut -ErrorAction Stop | Out-Null

          Start-Process -FilePath $shell -ArgumentList '--background' | Out-Null
          $deadline = [DateTime]::UtcNow.AddSeconds(20)
          do {
            Start-Sleep -Milliseconds 250
            try { $health = Invoke-RestMethod 'http://127.0.0.1:2999/api/v1/system/health' -TimeoutSec 1 }
            catch { $health = $null }
          } until (($health.status -in @('ok', 'degraded')) -or [DateTime]::UtcNow -ge $deadline)
          if ($health.status -notin @('ok', 'degraded')) { throw 'installed daemon did not become healthy' }

          $firstShell = @(Get-Process rundock -ErrorAction SilentlyContinue)
          if ($firstShell.Count -ne 1) { throw "expected one desktop shell, found $($firstShell.Count)" }
          Start-Process -FilePath $shell -PassThru | Wait-Process
          Start-Sleep -Milliseconds 500
          $secondShell = @(Get-Process rundock -ErrorAction SilentlyContinue)
          if ($secondShell.Count -ne 1 -or $secondShell[0].Id -ne $firstShell[0].Id) {
            throw 'second launch did not reuse the existing desktop shell'
          }

          $runValues = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          if (($runValues.PSObject.Properties.Value -join "`n") -notmatch 'rundock\.exe.*--background') {
            throw 'default login autostart was not registered with --background'
          }

          $ping = Join-Path $env:SystemRoot 'System32\PING.EXE'
          & $daemon start $ping --name ci-upgrade-survivor -- -t 127.0.0.1
          if ($LASTEXITCODE -ne 0) { throw 'failed to start upgrade survivor process' }
          $beforeUpgrade = (& $daemon --json list | ConvertFrom-Json).processes |
            Where-Object name -eq 'ci-upgrade-survivor'
          if (-not $beforeUpgrade.pid) { throw 'upgrade survivor has no PID' }

          $upgrade = Start-Process -FilePath $installer -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$installDir"
          ) -Wait -PassThru
          if ($upgrade.ExitCode -ne 0) { throw "in-place upgrade failed: $($upgrade.ExitCode)" }
          if (-not (Get-Process -Id $beforeUpgrade.pid -ErrorAction SilentlyContinue)) {
            throw 'in-place upgrade stopped the managed child process'
          }
          if (Get-Process rundock -ErrorAction SilentlyContinue) {
            throw 'silent upgrade unexpectedly left the desktop shell running'
          }

          Start-Process -FilePath $shell -ArgumentList '--background' | Out-Null
          $deadline = [DateTime]::UtcNow.AddSeconds(20)
          do {
            Start-Sleep -Milliseconds 250
            try { $health = Invoke-RestMethod 'http://127.0.0.1:2999/api/v1/system/health' -TimeoutSec 1 }
            catch { $health = $null }
          } until (($health.status -in @('ok', 'degraded')) -or [DateTime]::UtcNow -ge $deadline)
          if ($health.status -notin @('ok', 'degraded')) { throw 'upgraded daemon did not become healthy' }
          $afterUpgrade = (& $daemon --json list | ConvertFrom-Json).processes |
            Where-Object name -eq 'ci-upgrade-survivor'
          if ($afterUpgrade.id -ne $beforeUpgrade.id -or $afterUpgrade.pid -ne $beforeUpgrade.pid) {
            throw 'in-place upgrade did not re-adopt the exact managed process'
          }
          & $daemon stop ci-upgrade-survivor
          if ($LASTEXITCODE -ne 0) { throw 'failed to stop upgrade survivor before uninstall' }

          Start-Process -FilePath $shell -ArgumentList '--quit' -PassThru | Wait-Process
          $deadline = [DateTime]::UtcNow.AddSeconds(10)
          while ((Get-Process rundock -ErrorAction SilentlyContinue) -and [DateTime]::UtcNow -lt $deadline) {
            Start-Sleep -Milliseconds 200
          }
          if (Get-Process rundock -ErrorAction SilentlyContinue) { throw 'desktop shell did not exit' }
          $healthAfterShellExit = Invoke-RestMethod 'http://127.0.0.1:2999/api/v1/system/health' -TimeoutSec 2
          if ($healthAfterShellExit.status -notin @('ok', 'degraded')) { throw 'daemon stopped with desktop shell' }
          if (Get-NetTCPConnection -State Listen -LocalPort 5173 -ErrorAction SilentlyContinue) {
            throw 'production smoke unexpectedly found a 5173 listener'
          }

          $dataDir = Join-Path $env:APPDATA 'alter-pm2'
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
          $retentionMarker = Join-Path $dataDir 'ci-data-retention.txt'
          Set-Content -LiteralPath $retentionMarker -Value 'preserve'
          $uninstaller = Get-Item -LiteralPath (Join-Path $installDir 'unins000.exe') -ErrorAction Stop
          $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          ) -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "silent uninstall failed: $($uninstall.ExitCode)" }
          if (-not (Test-Path -LiteralPath $retentionMarker)) { throw 'uninstall removed user data' }
          if (Test-Path -LiteralPath $shell) { throw 'desktop shell remained after uninstall' }

  sonarqube:
    name: SonarQube quality gate
    needs: [frontend, rust, sonar-configuration]
    if: >-
      github.event_name == 'workflow_call' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Download frontend coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: frontend-coverage
          path: web-ui/coverage
      - name: Download Rust coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rust-coverage
          path: coverage
      - name: Analyze and wait for the quality gate
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
